# Aggressive: steer earlier and more often; BTM requests carry the
# "disassociation imminent" flag.
# WARNING with usteer (aggressiveness 2): usteer disconnects a client that
# did not move within roam_kick_delay. The native backend only
# disconnects with an explicit roamctl.steering.kick_mode=deauth.
rssi_offset=4
hyst_offset=-1
cooldown=60
retry_limit=5
pingpong_max=4
low_samples=2
band_steering=1
kick_mode=disassoc-imminent
usteer_aggressiveness=2
