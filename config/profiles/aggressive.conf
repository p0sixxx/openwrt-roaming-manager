# Aggressive: steer earlier and more often; BTM requests carry the
# "disassociation imminent" flag. Clients that ignore BTM are still NOT
# deauthenticated unless kick_mode=deauth is set explicitly in
# /etc/config/roamctl (roamctl.steering.kick_mode).
rssi_offset=4
hyst_offset=-1
cooldown=60
retry_limit=5
pingpong_max=4
low_samples=2
band_steering=1
kick_mode=disassoc-imminent
usteer_aggressiveness=2
