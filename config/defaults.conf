# OpenWrt Roaming Manager - default steering/roaming parameters
#
# These are *base* values. The steering optimizer adjusts them for the
# selected profile, the number of access points, the measured noise floor
# and the client load before they are used. Values are per band because
# 2.4, 5 and 6 GHz have different path loss, noise and client behaviour.

# Signal (dBm) below which a client is considered for AP steering
rssi_min_2g=-78
rssi_min_5g=-75
rssi_min_6g=-72

# Signal (dBm) considered "good"; clients above it are never steered for
# signal reasons and steering episodes re-arm above min+hysteresis
rssi_pref_2g=-65
rssi_pref_5g=-67
rssi_pref_6g=-65

# Hysteresis (dB): a candidate must be at least this much better when its
# signal is known, and a client must recover by this margin to re-arm
hyst_2g=5
hyst_5g=6
hyst_6g=6

# Band steering: a 2.4 GHz client stronger than this is offered 5/6 GHz
band_steer_rssi_2g=-60
# Expected minimum signal on the 5/6 GHz target (dBm)
band_target_min_5g=-70
band_target_min_6g=-68

# Anti ping-pong / retry protection
cooldown=120
retry_limit=3
pingpong_window=600
pingpong_max=3
min_assoc_time=30
low_samples=3

# Load awareness: clients per BSS above which load balancing is considered
load_threshold=20
load_diff=5

# Native steering daemon poll interval (seconds)
interval=15

# Noise floor assumed by usteer when converting SNR to signal
noise_ref_2g=-98
noise_ref_5g=-95
noise_ref_6g=-95

# Reference noise floor; measured noise above this raises thresholds
noise_expected=-92
